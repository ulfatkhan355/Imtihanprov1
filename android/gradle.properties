# Project-wide Gradle settings for Imtihan Pro Android Student App (JDK 17 / Android SDK 35)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Stage 2 API Base URL override (defaults to Android emulator host loopback -> local Wrangler Worker;
# override at build time with -PIMTIHAN_API_BASE_URL=https://imtihan-pro-api.<subdomain>.workers.dev/v1
# or change at runtime in Profile & Settings for physical device LAN testing)
IMTIHAN_API_BASE_URL=http://10.0.2.2:8787/v1
